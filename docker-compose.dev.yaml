services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: api
    command: node tools/scripts/dev-watch.js
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${PORT:-3000}:3000"

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
