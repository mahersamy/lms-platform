services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP: api
    # Install inside the container first (node_modules bind-mount shadows the image layer),
    # then start the webpack watcher. The pnpm store volume makes reinstalls near-instant.
    command: sh -c "pnpm install --frozen-lockfile && node tools/scripts/dev-watch.js"
    volumes:
      - .:/app
      # Named volume for pnpm's content-store → packages are cached between rebuilds
      - pnpm_store:/root/.local/share/pnpm/store
      # Named volume for node_modules → survives container recreation, populated at startup
      - api_node_modules:/app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${PORT:-3000}:3000"

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  pnpm_store:
  api_node_modules:
